<title>Nine-axis capability radar: Cosmogonic vs survey mean vs ALIEN</title><desc>Legacy comparison on a 0 to 5 scale; scores retain the existing rubric. Consciousness-theory describes implemented theory mechanisms, not demonstrated consciousness. Reproduction: Cosmogonic 4, survey mean 2.55, ALIEN 4. Open-endedness: Cosmogonic 2, survey mean 2.51, ALIEN 4. Ecology: Cosmogonic 3.4, survey mean 2.2, ALIEN 4. Morphology/Physics: Cosmogonic 3.8, survey mean 2.17, ALIEN 5. Cognition/Learning: Cosmogonic 4.5, survey mean 1.85, ALIEN 3. Substrate pluralism: Cosmogonic 4.6, survey mean 1.09, ALIEN 3. Instrumentation: Cosmogonic 4.4, survey mean 3.02, ALIEN 3. Consciousness-theory: Cosmogonic 3.5, survey mean 0.1, ALIEN 0.5. Visual scale: Cosmogonic 4, survey mean 2.76, ALIEN 5.</desc><text x="20" y="30" fill="#cbd5e1" font-size="20" font-weight="700">Nine-axis capability profile</text><text x="20" y="58" fill="#f59e0b" font-size="16">Amber: Cosmogonic</text><text x="20" y="84" fill="#a78bfa" font-size="16">Violet: survey mean</text><text x="20" y="110" fill="#34d399" font-size="16">Green: nearest peer (ALIEN)</text><polygon points="240,276.8 254.91,282.23 262.85,295.97 260.09,311.6 247.93,321.8 232.07,321.8 219.91,311.6 217.15,295.97 225.09,282.23" fill="none" stroke="#27344d" stroke-width="0.7"/><polygon points="240,253.6 269.83,264.46 285.7,291.94 280.18,323.2 255.87,343.6 224.13,343.6 199.82,323.2 194.3,291.94 210.17,264.46" fill="none" stroke="#27344d" stroke-width="0.7"/><polygon points="240,230.4 284.74,246.68 308.54,287.91 300.28,334.8 263.8,365.4 216.2,365.4 179.72,334.8 171.46,287.91 195.26,246.68" fill="none" stroke="#27344d" stroke-width="0.7"/><polygon points="240,207.2 299.65,228.91 331.39,283.89 320.37,346.4 271.74,387.2 208.26,387.2 159.63,346.4 148.61,283.89 180.35,228.91" fill="none" stroke="#27344d" stroke-width="0.7"/><polygon points="240,184 314.56,211.14 354.24,279.86 340.46,358 279.67,409 200.33,409 139.54,358 125.76,279.86 165.44,211.14" fill="none"