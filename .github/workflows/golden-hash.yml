name: Post-build smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: HTTP smoke (health + pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build + smoke
        run: bun run smoke

  browser-e2e:
    name: Browser e2e (sandbox panel + Mini World, headless Chromium)
    runs-on: ubuntu-latest
    # Software-GL (swiftshader) boot of the full world takes ~10 min per viewport; 30 min timed out.
    timeout-minutes: 60
    # Non-blocking while its runtime on hosted runners (software WebGL) is measured.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Serve dist/ and run the e2e smoke
        timeout-minutes: 55
        env:
          E2E_BOOT_MS: '1200000'
        run: |
          (cd dist && python3 -m http.server 8765 >/tmp/serve.log 2>&1 &)
          sleep 2
          node scripts/e2e-browser.mjs http://localhost:8765/ e2e-shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-shots
          path: e2e-shots/
          retention-days: 7
