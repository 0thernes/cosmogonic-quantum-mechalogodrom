<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">CQM-25: digital-life research profile</title><desc id="desc">Twenty-five named research dimensions with categorical repository evidence states. No numerical capability, consciousness, sentience or general-intelligence score is inferred.</desc><rect width="1000" height="1280" rx="16" fill="#09111c"/><text x="32" y="48" fill="#e4edf7" font-size="27" font-weight="700">CQM-25 · Digital-life research profile</text><text x="32" y="78" fill="#b0c2d7" font-size="15">Individual beings · interacting populations · constructed worlds</text><text x="32" y="105" fill="#fbbf24" font-size="14">Evidence inventory only. Capability scores are uncalibrated; no aggregate verdict.</text><g><rect x="24" y="128" width="952" height="38" rx="5" fill="#0d1b2b"/><text x="40" y="152" fill="#5eead4" font-size="15">01</text><text x="78" y="152" fill="#e4edf7" font-size="16">Reproduction and heredity</text><text x="955" y="152" text-anchor="end" fill="#5eead4" font-size="13">Bounded test evidence</text></g>
