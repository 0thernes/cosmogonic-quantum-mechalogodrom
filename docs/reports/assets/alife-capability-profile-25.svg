<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1444" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">CQM-25 v1.0.0: canonical project standard</title><desc id="desc">Canonical project standard adopted 2026-10-22. Evidence reviewed 2026-10-21. Acceptance experiments remain proposed and unexecuted as a unified benchmark. Twenty-five named dimensions with categorical repository evidence states, each tagged with its construct-only legacy survey correspondence, if any. No numerical capability, consciousness, sentience or general-intelligence score is inferred.</desc><rect width="1000" height="1444" rx="16" fill="#09111c"/><text x="32" y="48" fill="#e4edf7" font-size="27" font-weight="700">CQM-25 v1.0.0 · Canonical project standard</text><text x="32" y="78" fill="#b0c2d7" font-size="15">Adopted 2026-10-22 (ADR 0018) · evidence reviewed 2026-10-21 · entity / population / world</text><text x="32" y="105" fill="#fbbf24" font-size="14">Proposed experiments; unified benchmark unexecuted. Scores uncalibrated; no aggregate verdict.</text><g><rect x="24" y="134" width="952" height="44" rx="5" fill="#0d1b2b"/><text x="40" y="160" fill="#5eead4" font-size="15">01</text><text x="78" y="160" fill="#e4edf7" font-size="16">Reproduction and heredity</text><text x="78" y="175" fill="#8ea3bd" font-size="11.5">Legacy construct correspondence: Reproduction</text><text x="955" y="160" text-anchor="end" fill="#5eead4" font-size="13">Bounded test evidence</text></g>
